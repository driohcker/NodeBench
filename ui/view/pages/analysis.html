                <section id="page-analysis" class="page">
                    <div class="tab-bar" id="analysis-tab-bar">
                        <button class="tab-btn active" data-mode="raw">原始数据分析</button>
                        <button class="tab-btn" data-mode="report">数据报告分析</button>
                    </div>

                    <!-- 原始数据分析子页面 -->
                    <div id="analysis-raw-panel" class="analysis-subpage active">
                        <div class="card-grid cols-2">
                            <div class="card">
                                <div class="card-header">
                                    <h3>原始测试数据</h3>
                                </div>
                                <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                                    <table class="data-table">
                                        <thead>
                                            <tr>
                                                <th>会话ID</th>
                                                <th>时间</th>
                                                <th>结果</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody id="analysis-raw-table">
                                            <tr><td colspan="4" class="text-muted text-center">暂无数据</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h3>执行分析</h3>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label>会话 ID</label>
                                        <input type="text" class="form-input" id="analysis-raw-session-id" placeholder="输入会话ID">
                                    </div>
                                    <div class="form-group">
                                        <label>分析策略</label>
                                        <select class="form-select" id="analysis-raw-strategy-select">
                                            <option value="doubleWindow">滑动窗口均值突变检测</option>
                                            <option value="cusum">CUSUM 累积和算法</option>
                                            <option value="slopeChange">趋势测试（线性回归斜率变化）</option>
                                        </select>
                                    </div>
                                    <button class="btn btn-primary" id="analysis-raw-run-btn">🔍 执行分析</button>
                                </div>
                            </div>
                        </div>

                        <div class="card" id="analysis-raw-result-card" style="display: none;">
                            <div class="card-header">
                                <h3>分析成果</h3>
                            </div>
                            <div class="card-body">
                                <div id="analysis-raw-result-text"></div>
                                <div class="chart-container">
                                    <canvas id="analysis-raw-chart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 数据报告分析子页面 -->
                    <div id="analysis-report-panel" class="analysis-subpage" style="display: none;">
                        <div class="card-grid cols-2">
                            <div class="card">
                                <div class="card-header">
                                    <h3>数据报告</h3>
                                </div>
                                <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                                    <table class="data-table">
                                        <thead>
                                            <tr>
                                                <th>会话ID</th>
                                                <th>时间</th>
                                                <th>来源</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody id="analysis-report-table">
                                            <tr><td colspan="4" class="text-muted text-center">暂无数据</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h3>生成标定报告</h3>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label>会话 ID</label>
                                        <input type="text" class="form-input" id="analysis-report-session-id" placeholder="输入会话ID">
                                    </div>
                                    <button class="btn btn-success" id="analysis-report-benchmark-btn">📊 生成标定报告</button>
                                    <div class="form-row" style="margin-top:12px;">
                                        <div class="form-group">
                                            <label>转码格式</label>
                                            <select class="form-select" id="analysis-report-transcode-format">
                                                <option value="pdf">PDF</option>
                                                <option value="excel">Excel</option>
                                            </select>
                                        </div>
                                        <div class="form-group" style="display:flex;align-items:flex-end;">
                                            <button class="btn btn-small btn-primary" id="analysis-report-transcode-btn">🔄 转码</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card" id="analysis-report-result-card" style="display: none;">
                            <div class="card-header">
                                <h3>数据报告预览</h3>
                            </div>
                            <div class="card-body">
                                <div id="analysis-report-result-text"></div>
                            </div>
                        </div>
                    </div>
                </section>
